[package]
name = "mecalin"
version = "1.1.2"
edition = "2024"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
libadwaita = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
gio = "0.22"
glib = { version = "0.22", features = ["log_macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
i18n-format = "0.4"
rand = "0.10"
anyhow = "1.0"
unicode-segmentation = "1.12"
include_dir = "0.7"
strum = "0.28"
strum_macros = "0.28"

[build-dependencies]
glib-build-tools = "0.22"
regex = "1.11"
